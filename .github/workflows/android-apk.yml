name: Android APK

on:
  push:
    paths:
      - 'outputs/gestor-financeiro-android/android/**'
      - 'outputs/gestor-financeiro-android/public/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: outputs/gestor-financeiro-android/android
        run: gradle --no-daemon --stacktrace --console=plain assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gestor-financeiro-android-v1.3
          path: outputs/gestor-financeiro-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

